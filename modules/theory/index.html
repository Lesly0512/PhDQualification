<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>理論彙整 | 博士資格考</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    function toggleDarkMode() { document.documentElement.classList.toggle('dark'); }
  </script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }
    .dark .glass { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); }
    .glass:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.85); }
    .badge { font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 9999px; font-weight: 600; }
    .badge-th { background-color: #f3e8ff; color: #6b21a8; }
    .dark .badge-th { background-color: #581c87; color: #f3e8ff; }
  </style>
</head>
<body class="bg-gradient-to-tr from-purple-100 via-pink-100 to-rose-200 dark:from-slate-900 dark:to-purple-950 text-gray-800 dark:text-gray-100 px-4 py-8 min-h-screen">
  <div class="max-w-5xl mx-auto space-y-8">
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="p-3 bg-white/50 dark:bg-slate-700/50 rounded-2xl shadow-sm backdrop-blur-sm"><span class="text-4xl">🧠</span></div>
        <div>
          <h1 class="text-3xl font-extrabold tracking-tight">理論彙整筆記</h1>
          <p class="text-sm text-slate-600 dark:text-slate-400 font-medium mt-1">Management & Education Theories</p>
        </div>
      </div>
      <button onclick="toggleDarkMode()" class="text-sm font-medium px-4 py-2 rounded-full bg-white/40 dark:bg-slate-700/40 border border-white/20 shadow-sm">🌗 夜間模式</button>
    </header>

    <nav class="flex text-sm font-medium text-slate-500 dark:text-slate-400">
      <a href="../../index.html" class="hover:text-purple-600 transition flex items-center gap-1">首頁</a>
      <span class="mx-2 opacity-50">/</span><span>理論彙整</span>
    </nav>

    <section class="grid md:grid-cols-2 gap-6">
      <!-- 理論卡片 -->
      <div class="glass p-6 rounded-2xl group cursor-pointer">
        <div class="flex items-center gap-3 mb-4"><span class="badge badge-th">動機理論</span></div>
        <h2 class="text-xl font-bold mb-3 group-hover:text-purple-600 transition">自我決定論 (SDT)</h2>
        <p class="text-sm text-slate-600 dark:text-slate-300">Deci & Ryan: Autonomy, Competence, Relatedness.</p>
      </div>

      <div class="glass p-6 rounded-2xl group cursor-pointer">
        <div class="flex items-center gap-3 mb-4"><span class="badge badge-th">資源理論</span></div>
        <h2 class="text-xl font-bold mb-3 group-hover:text-purple-600 transition">資源保存理論 (COR)</h2>
        <p class="text-sm text-slate-600 dark:text-slate-300">Hobfoll: 壓力的產生源於資源的流失或潛在流失威脅。</p>
      </div>
    </section>
  </div>
</body>
</html>
